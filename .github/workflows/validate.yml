name: Validate Dhappabaj

on:
  push:
    branches:
      - main
      - optimise/firebase-cost-security-cleanup
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Type-check
        run: npm run lint

      - name: Build production bundle
        run: npm run build
